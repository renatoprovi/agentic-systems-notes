# Providers the agent's "brain" (litellm_bridge.py) could point at — add a
# new one here, not in code. env_vars are the keys litellm itself reports
# as required via litellm.validate_environment(model), not guessed.
providers:
  - name: OpenAI
    model: gpt-4o
    env_vars: [OPENAI_API_KEY]
  - name: Anthropic
    model: claude-opus-5
    env_vars: [ANTHROPIC_API_KEY]
  - name: Vertex AI
    model: vertex_ai/gemini-1.5-pro
    env_vars: [VERTEXAI_PROJECT, VERTEXAI_LOCATION]
  - name: Azure OpenAI
    model: azure/<deployment-name>
    env_vars: [AZURE_API_BASE, AZURE_API_VERSION, AZURE_API_KEY]
  - name: Bedrock
    model: bedrock/anthropic.claude-3-sonnet
    env_vars: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
  - name: Ollama (local)
    model: ollama/llama3
    env_vars: [OLLAMA_API_BASE]
  - name: DeepSeek
    model: deepseek/deepseek-chat
    env_vars: [DEEPSEEK_API_KEY]
